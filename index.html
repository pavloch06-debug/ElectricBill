<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1923">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Світло">
<title>Калькулятор світла</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Unbounded:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f14;
    --surface: #111a22;
    --surface2: #172030;
    --border: #1e3045;
    --accent: #00d4ff;
    --accent2: #ff6b35;
    --accent3: #39ff8a;
    --text: #e8f4f8;
    --muted: #5a7a8a;
    --danger: #ff4a5a;
    --yellow: #ffd000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'JetBrains Mono', monospace; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); padding: 12px; max-width: 600px; margin: 0 auto; padding-bottom: 80px; }
  h1 { font-family: 'Unbounded', sans-serif; font-size: 18px; font-weight: 700; text-align: center; margin: 10px 0 15px; color: var(--text); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  h1 span { color: var(--accent); }
  
  .pwa-btn-card { background: linear-gradient(135deg, rgba(0,212,255,0.1), rgba(255,107,53,0.1)); border: 1px solid var(--accent); border-radius: 14px; padding: 12px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .pwa-btn-text { font-size: 11px; font-weight: 600; line-height: 1.4; }
  .pwa-btn-text strong { color: var(--accent); display: block; font-size: 12px; }
  .btn-pwa-install { background: var(--accent); color: #000; border: none; border-radius: 8px; padding: 8px 14px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
  .card-title { font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: 1px; margin-bottom: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .input-group { margin-bottom: 10px; position: relative; }
  label { display: block; font-size: 10px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; color: #fff; font-size: 14px; font-weight: 600; outline: none; }
  
  .btn { width: 100%; background: var(--accent); color: var(--bg); border: none; border-radius: 12px; padding: 14px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; font-family: 'Unbounded', sans-serif; box-shadow: 0 4px 12px rgba(0,212,255,0.2); }
  .btn:active { transform: scale(0.98); }
  .btn-danger { background: transparent; border: 1px solid var(--border); color: var(--danger); margin-top: 8px; padding: 8px; font-size: 10px; }
  .btn-edit { background: var(--surface2); border: 1px solid var(--border); color: var(--yellow); padding: 6px 12px; font-size: 10px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 6px; }
  .share-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .btn-share { background: var(--surface2); border: 1px solid var(--border); color: var(--accent); padding: 8px; font-size: 11px; border-radius: 8px; cursor: pointer; font-weight: 600; }

  .columns-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 8px; }
  .col-block { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 10px; padding: 8px; }
  .col-block-title { font-size: 10px; font-weight: 700; text-transform: uppercase; text-align: center; padding-bottom: 6px; border-bottom: 1px solid var(--border); margin-bottom: 6px; color: var(--accent); }
  .col-block:nth-child(2) .col-block-title { color: var(--accent2); }
  .col-block:nth-child(3) .col-block-title { color: var(--accent3); }
  
  .data-item { font-size: 10px; margin-bottom: 5px; line-height: 1.3; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 3px; }
  .data-item:last-child { border-bottom: none; margin-bottom: 0; }
  .data-item span { color: var(--muted); display: block; font-size: 9px; }
  .data-item strong { color: var(--text); }

  #resultBox { display: none; }
  .res-header-total { font-family: 'Unbounded', sans-serif; font-size: 16px; font-weight: 700; color: var(--accent3); text-align: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px dashed var(--border); }
  
  .history-item { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 12px; position: relative; }
  .history-date { font-size: 10px; color: var(--yellow); margin-bottom: 6px; font-weight: 700; }
  .history-del { position: absolute; top: 10px; right: 10px; color: var(--muted); background: none; border: none; cursor: pointer; font-size: 14px; }
  
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #fff; color: #000; padding: 12px 24px; border-radius: 30px; font-weight: 600; font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); transition: transform 0.3s; z-index: 1000; }
  #toast.show { transform: translateX(-50%) translateY(0); }
  .prev-badge { background: rgba(0,212,255,0.04); border: 1px dashed rgba(0,212,255,0.15); border-radius: 10px; padding: 8px; margin-bottom: 8px; font-size: 11px; line-height: 1.4; }
</style>
</head>
<body>

<h1>⚡ СВІТЛО<span>.calc</span></h1>

<div class="pwa-btn-card" id="alwaysInstallCard">
  <div class="pwa-btn-text">
    <strong>📲 Додати на екран</strong>
    Швидкий доступ без інтернету
  </div>
  <button class="btn-pwa-install" id="btnAlwaysInstall">Встановити</button>
</div>

<div class="card">
  <div class="card-title">Показники за цей місяць</div>
  <div class="grid-2">
    <div class="input-group"><label>T1 Кв1 (День)</label><input type="number" step="0.001" id="curr_t1" placeholder="0.000"></div>
    <div class="input-group"><label>T2 Кв1 (Ніч)</label><input type="number" step="0.001" id="curr_t2" placeholder="0.000"></div>
  </div>
  <div class="grid-2">
    <div class="input-group"><label>1.8.2 Загальний (День)</label><input type="number" step="0.001" id="curr_v182" placeholder="0.000"></div>
    <div class="input-group"><label>1.8.1 Загальний (Ніч)</label><input type="number" step="0.001" id="curr_v181" placeholder="0.000"></div>
  </div>
  <div class="input-group" style="margin-top: 4px;">
    <label>Ціна за кВт⋅год (грн)</label>
    <input type="number" step="0.01" id="price" value="4.32">
  </div>
</div>

<button class="btn" id="btnCalc">Розрахувати</button>

<div class="card" id="resultBox">
  <div class="card-title">Результат розрахунку</div>
  <div class="res-header-total" id="resHeaderTotal">Загальна сума: 0.00 грн</div>
  <div class="columns-3" id="resColumns"></div>
</div>

<div class="card">
  <div class="card-title">Попередній місяць (База)</div>
  <div id="prevBadge" class="prev-badge">Немає збережених даних</div>
  <div id="prevEditActions" style="display:none;"><button class="btn-edit" id="btnEditPrev">✏️ Редагувати базу</button></div>
  <button class="btn btn-danger" id="btnClearPrev">Скинути базу</button>
  
  <div class="share-grid">
    <button class="btn-share" id="btnExport">📋 Скопіювати базу</button>
    <button class="btn-share" id="btnImport">📥 Вставити базу</button>
  </div>
</div>

<div class="card">
  <div class="card-title">Історія записів</div>
  <div id="historyList"></div>
</div>

<div id="toast"></div>

<script>
let state = {
  prev: JSON.parse(localStorage.getItem('svitlo_prev')) || null,
  history: JSON.parse(localStorage.getItem('svitlo_history')) || []
};

document.addEventListener('DOMContentLoaded', () => {
  renderPrev();
  renderHistory();
  document.getElementById('btnCalc').addEventListener('click', calculate);
  document.getElementById('btnClearPrev').addEventListener('click', clearPrev);
  document.getElementById('btnEditPrev').addEventListener('click', editPrev);
  document.getElementById('btnExport').addEventListener('click', exportData);
  document.getElementById('btnImport').addEventListener('click', importData);

  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
    document.getElementById('alwaysInstallCard').style.display = 'none';
  }
});

function renderPrev() {
  const b = document.getElementById('prevBadge');
  const actions = document.getElementById('prevEditActions');
  if(!state.prev) {
    b.innerHTML = 'Введіть дані. Перший розрахунок створить стартову базу.';
    actions.style.display = 'none';
    return;
  }
  b.innerHTML = `
    Минулі Кв1 - День: ${state.prev.t1.toFixed(3)} | Ніч: ${state.prev.t2.toFixed(3)}<br>
    Минулі Загальні - День: ${state.prev.v182.toFixed(3)} | Ніч: ${state.prev.v181.toFixed(3)}
  `;
  actions.style.display = 'block';
}

function editPrev() {
  if(!state.prev) return;
  const nT1 = prompt("Минулий T1 Кв1 (День):", state.prev.t1); if (nT1 === null) return;
  const nT2 = prompt("Минулий T2 Кв1 (Ніч):", state.prev.t2); if (nT2 === null) return;
  const nV2 = prompt("Минулий Загальний 1.8.2 (День):", state.prev.v182); if (nV2 === null) return;
  const nV1 = prompt("Минулий Загальний 1.8.1 (Ніч):", state.prev.v181); if (nV1 === null) return;

  state.prev = { t1: parseFloat(nT1)||0, t2: parseFloat(nT2)||0, v182: parseFloat(nV2)||0, v181: parseFloat(nV1)||0 };
  localStorage.setItem('svitlo_prev', JSON.stringify(state.prev));
  renderPrev();
  showToast('✏️ Базу змінено!');
}

function calculate() {
  const цей_міс_кв1_день = parseFloat(document.getElementById('curr_t1').value) || 0;
  const цей_міс_кв1_ніч = parseFloat(document.getElementById('curr_t2').value) || 0;
  const цей_міс_заг_день = parseFloat(document.getElementById('curr_v182').value) || 0;
  const цей_міс_заг_ніч = parseFloat(document.getElementById('curr_v181').value) || 0;
  const ціна = parseFloat(document.getElementById('price').value) || 0;

  if(!цей_міс_кв1_день || !цей_міс_кв1_ніч || !цей_міс_заг_день || !цей_міс_заг_ніч) { 
    showToast('❌ Заповніть всі поля!'); 
    return; 
  }

  if(!state.prev) {
    state.prev = { t1: цей_міс_кв1_день, t2: цей_міс_кв1_ніч, v182: цей_міс_заг_день, v181: цей_міс_заг_ніч };
    localStorage.setItem('svitlo_prev', JSON.stringify(state.prev));
    renderPrev();
    showToast('💾 Стартову базу записано!');
    return;
  }

  // --- МАТЕМАТИКА З УРАХУВАННЯМ: 1.8.2 = ДЕНЬ, 1.8.1 = НІЧ ---
  
  // Квартира 1
  const кв1_різниця_день = цей_міс_кв1_день - state.prev.t1;
  const кв1_різниця_ніч = цей_міс_кв1_ніч - state.prev.t2;
  const кв1_сума_день = кв1_різниця_day = кв1_різниця_день * ціна;
  const кв1_сума_ніч = (кв1_різниця_ніч * ціна) / 2; // Ніч ділимо на 2
  const кв1_разом = кв1_сума_день + кв1_сума_ніч;

  // Загальні по дому
  const заг_різниця_день = цей_міс_заг_день - state.prev.v182;
  const заг_різниця_ніч = цей_міс_заг_ніч - state.prev.v181;
  const заг_всього_квт = заг_різниця_день + заг_різниця_ніч;
  const заг_сума_день = заг_різниця_день * ціна;
  const заг_сума_ніч = (заг_різниця_ніч * ціна) / 2; // Ніч ділимо на 2
  const заг_разом_грн = заг_сума_день + заг_сума_ніч;

  // Квартира 2 (Загальне мінус Кв1)
  const кв2_різниця_день = заг_різниця_день - кв1_різниця_день;
  const кв2_різниця_ніч = заг_різниця_ніч - кв1_різниця_ніч;
  const кв2_сума_день = кв2_різниця_день * ціна;
  const кв2_сума_ніч = (кв2_різниця_ніч * ціна) / 2; // Ніч ділимо на 2
  const кв2_разом = кв2_сума_день + кв2_сума_ніч;

  if(кв1_різниця_день < 0 || кв1_різниця_ніч < 0 || заг_різниця_день < 0 || заг_різниця_ніч < 0 || кв2_різниця_день < 0 || кв2_різниця_ніч < 0) {
    showToast('⚠️ Показники менші за минулий місяць!');
    return;
  }

  document.getElementById('resHeaderTotal').textContent = `Всього до сплати по дому: ${заг_разом_грн.toFixed(2)} грн`;
  document.getElementById('resColumns').innerHTML = buildColumnsHTML({
    заг_різниця_день, заг_різниця_ніч, заг_всього_квт, заг_сума_день, заг_сума_ніч, заг_разом_грн,
    цей_міс_кв1_день, цей_міс_кв1_ніч, кв1_різниця_день, кв1_різниця_ніч, кв1_сума_день, кв1_сума_ніч, кв1_разом,
    цей_міс_заг_день, цей_міс_заг_ніч, кв2_різниця_день, кв2_різниця_ніч, кв2_сума_день, кв2_сума_ніч, кв2_разом
  });
  document.getElementById('resultBox').style.display = 'block';

  const record = {
    id: Date.now(),
    date: new Date().toLocaleString('uk-UA', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
    data: { 
      заг_різниця_день, заг_різниця_ніч, заг_всього_квт, заг_сума_день, заг_сума_ніч, заг_разом_грн,
      цей_міс_кв1_день, цей_міс_кв1_ніч, кв1_різниця_день, кв1_різниця_ніч, кв1_сума_день, кв1_сума_ніч, кв1_разом,
      цей_міс_заг_день, цей_міс_заг_ніч, кв2_різниця_день, кв2_різниця_ніч, кв2_сума_день, кв2_сума_ніч, кв2_разом
    }
  };

  state.history.unshift(record);
  localStorage.setItem('svitlo_history', JSON.stringify(state.history));
  
  state.prev = { t1: цей_міс_кв1_день, t2: цей_міс_кв1_ніч, v182: цей_міс_заг_день, v181: цей_міс_заг_ніч };
  localStorage.setItem('svitlo_prev', JSON.stringify(state.prev));
  
  renderPrev();
  renderHistory();
  showToast('✅ Збережено в історію!');
}

function buildColumnsHTML(d) {
  return `
    <div class="col-block">
      <div class="col-block-title">Загальні</div>
      <div class="data-item"><span>Різниця День</span><strong>${d.заг_різниця_день.toFixed(3)}</strong></div>
      <div class="data-item"><span>Різниця Ніч</span><strong>${d.заг_різниця_ніч.toFixed(3)}</strong></div>
      <div class="data-item"><span>Всього кВт</span><strong>${d.заг_всього_квт.toFixed(3)}</strong></div>
      <div class="data-item"><span>Ціна День</span><strong>${d.заг_сума_день.toFixed(2)} ₴</strong></div>
      <div class="data-item"><span>Ціна Ніч</span><strong>${d.заг_сума_ніч.toFixed(2)} ₴</strong></div>
      <div class="data-item"><span style="color:var(--accent)">Вся сума</span><strong>${d.заг_разом_грн.toFixed(2)} ₴</strong></div>
    </div>
    <div class="col-block">
      <div class="col-block-title">Кв №1</div>
      <div class="data-item"><span>Цей міс День</span><strong>${d.цей_міс_кв1_день.toFixed(3)}</strong></div>
      <div class="data-item"><span>Цей міс Ніч</span><strong>${d.цей_міс_кв1_ніч.toFixed(3)}</strong></div>
      <div class="data-item"><span>Різниця День</span><strong>${d.кв1_різниця_день.toFixed(3)}</strong></div>
      <div class="data-item"><span>Різниця Ніч</span><strong>${d.кв1_різниця_ніч.toFixed(3)}</strong></div>
      <div class="data-item"><span>Сума День</span><strong>${d.кв1_сума_день.toFixed(2)} ₴</strong></div>
      <div class="data-item"><span>Сума Ніч</span><strong>${d.кв1_сума_ніч.toFixed(2)} ₴</strong></div>
      <div class="data-item"><span style="color:var(--accent2)">Разом Кв1</span><strong>${d.кв1_разом.toFixed(2)} ₴</strong></div>
    </div>
    <div class="col-block">
      <div class="col-block-title">Кв №2</div>
      <div class="data-item"><span>Цей міс День</span><strong>${d.цей_міс_заг_день.toFixed(3)}</strong></div>
      <div class="data-item"><span>Цей міс Ніч</span><strong>${d.цей_міс_заг_ніч.toFixed(3)}</strong></div>
      <div class="data-item"><span>Різниця День</span><strong>${d.кв2_різниця_день.toFixed(3)}</strong></div>
      <div class="data-item"><span>Різниця Ніч</span><strong>${d.кв2_різниця_ніч.toFixed(3)}</strong></div>
      <div class="data-item"><span>Сума День</span><strong>${d.кв2_сума_день.toFixed(2)} ₴</strong></div>
      <div class="data-item"><span>Сума Ніч</span><strong>${d.кв2_сума_ніч.toFixed(2)} ₴</strong></div>
      <div class="data-item"><span style="color:var(--accent3)">Разом Кв2</span><strong>${d.кв2_разом.toFixed(2)} ₴</strong></div>
    </div>
  `;
}

function renderHistory() {
  const container = document.getElementById('historyList');
  if(state.history.length === 0) { container.innerHTML = '<div style="color:var(--muted); font-size:11px; text-align:center; padding:10px;">Історія порожня</div>'; return; }
  container.innerHTML = state.history.map(item => `
    <div class="history-item">
      <div class="history-date">📅 Дата: ${item.date}</div>
      <button class="history-del" onclick="deleteHistory(${item.id})">✕</button>
      <div class="columns-3">${buildColumnsHTML(item.data)}</div>
    </div>
  `).join('');
}

function exportData() {
  if (state.history.length === 0 && !state.prev) { showToast('❌ Немає даних для копіювання'); return; }
  const dataString = btoa(encodeURIComponent(JSON.stringify(state)));
  navigator.clipboard.writeText(dataString).then(() => { showToast('📋 Базу скопійовано! Надішліть її текстом.'); }).catch(() => { alert("Код бази: " + dataString); });
}

function importData() {
  const code = prompt("Введіть скопійований код бази:");
  if (!code) return;
  try {
    const decoded = JSON.parse(decodeURIComponent(atob(code)));
    if (decoded.prev || decoded.history) {
      if (confirm("Увага! Це повністю перезапише ваші поточні записи та базу. Продовжити?")) {
        state = decoded;
        localStorage.setItem('svitlo_prev', JSON.stringify(state.prev));
        localStorage.setItem('svitlo_history', JSON.stringify(state.history));
        renderPrev(); renderHistory();
        showToast('📥 Дані успішно імпортовано!');
      }
    } else { showToast('❌ Невірний код бази'); }
  } catch(e) { showToast('❌ Помилка розшифровки коду'); }
}

window.deleteHistory = function(id) {
  state.history = state.history.filter(x => x.id !== id);
  localStorage.setItem('svitlo_history', JSON.stringify(state.history));
  renderHistory();
  showToast('🗑️ Запис видалено');
};

function clearPrev() {
  if(confirm('Скинути базу?')) { state.prev = null; localStorage.removeItem('svitlo_prev'); renderPrev(); showToast('🗑️ Базу скинуто'); }
}

function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
document.getElementById('btnAlwaysInstall').addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt(); const { outcome } = await deferredPrompt.userChoice; deferredPrompt = null;
    if (outcome === 'accepted') { showToast('✅ Встановлено!'); document.getElementById('alwaysInstallCard').style.display = 'none'; }
  } else { alert("Натисни на 'три крапки' в меню Chrome та вибери 'Додати на головний екран'."); }
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const newWorker = reg.installing;
      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          showToast('🔄 Оновлення калькулятора...');
          setTimeout(() => { window.location.reload(); }, 1500);
        }
      });
    });
  }).catch(() => {});
}
</script>
</body>
</html>
