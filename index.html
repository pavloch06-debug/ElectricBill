<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1923">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Світло">
<title>Калькулятор світла</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Unbounded:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f14;
    --surface: #111a22;
    --surface2: #172030;
    --border: #1e3045;
    --accent: #00d4ff;
    --accent2: #ff6b35;
    --accent3: #39ff8a;
    --text: #e8f4f8;
    --muted: #5a7a8a;
    --danger: #ff4a5a;
    --yellow: #ffd000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'JetBrains Mono', monospace; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); padding: 16px; max-width: 480px; margin: 0 auto; padding-bottom: 80px; }
  h1 { font-family: 'Unbounded', sans-serif; font-size: 20px; font-weight: 700; text-align: center; margin: 10px 0 20px; color: var(--text); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  h1 span { color: var(--accent); }
  
  /* Завжди видима кнопка встановлення */
  .pwa-btn-card { background: linear-gradient(135deg, rgba(0,212,255,0.1), rgba(255,107,53,0.1)); border: 1px solid var(--accent); border-radius: 14px; padding: 12px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .pwa-btn-text { font-size: 11px; font-weight: 600; line-height: 1.4; }
  .pwa-btn-text strong { color: var(--accent); display: block; font-size: 12px; }
  .btn-pwa-install { background: var(--accent); color: #000; border: none; border-radius: 8px; padding: 8px 14px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
  .card-title { font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: 1px; margin-bottom: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .input-group { margin-bottom: 12px; position: relative; }
  .input-group:last-child { margin-bottom: 0; }
  label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; color: #fff; font-size: 15px; font-weight: 600; outline: none; transition: all 0.2s; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0,212,255,0.1); }
  .btn { width: 100%; background: var(--accent); color: var(--bg); border: none; border-radius: 12px; padding: 14px; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(0,212,255,0.2); transition: all 0.2s; font-family: 'Unbounded', sans-serif; }
  .btn:active { transform: scale(0.98); opacity: 0.9; }
  .btn-danger { background: transparent; border: 1px solid var(--border); color: var(--danger); box-shadow: none; margin-top: 8px; padding: 10px; font-size: 11px; }
  .btn-edit { background: var(--surface2); border: 1px solid var(--border); color: var(--yellow); padding: 6px 12px; font-size: 11px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 8px; display: inline-flex; align-items: center; gap: 4px; }
  #resultBox { display: none; background: linear-gradient(135deg, var(--surface), var(--surface2)); border-left: 4px solid var(--accent3); }
  .res-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
  .res-row:last-child { border-bottom: none; padding-bottom: 0; }
  .res-total { font-family: 'Unbounded', sans-serif; font-size: 20px; font-weight: 700; color: var(--accent3); text-align: right; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .history-item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; font-size: 12px; position: relative; }
  .history-date { font-size: 10px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .history-del { position: absolute; top: 10px; right: 10px; color: var(--muted); background: none; border: none; cursor: pointer; font-size: 14px; padding: 4px; }
  .history-del:hover { color: var(--danger); }
  .history-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.05); }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #fff; color: #000; padding: 12px 24px; border-radius: 30px; font-weight: 600; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 1000; pointer-events: none; white-space: nowrap; }
  #toast.show { transform: translateX(-50%) translateY(0); }
  .prev-badge { background: rgba(0,212,255,0.05); border: 1px dashed rgba(0,212,255,0.2); border-radius: 8px; padding: 8px; margin-bottom: 12px; font-size: 11px; line-height: 1.5; }
</style>
</head>
<body>

<h1>⚡ СВІТЛО<span>.calc</span></h1>

<!-- КНОПКА ВСТАНОВЛЕННЯ, ЯКА ТУТ ЗАВЖДИ -->
<div class="pwa-btn-card" id="alwaysInstallCard">
  <div class="pwa-btn-text">
    <strong>📲 Додати на екран</strong>
    Швидкий доступ без інтернету
  </div>
  <button class="btn-pwa-install" id="btnAlwaysInstall">Встановити</button>
</div>

<!-- ПОТОЧНІ ПОКАЗНИКИ -->
<div class="card">
  <div class="card-title">Поточні показники (Цей місяць)</div>
  <div class="grid-2">
    <div class="input-group">
      <label>T1 (День)</label>
      <input type="number" step="0.001" id="curr_t1" placeholder="0.000">
    </div>
    <div class="input-group">
      <label>T2 (Ніч)</label>
      <input type="number" step="0.001" id="curr_t2" placeholder="0.000">
    </div>
  </div>
  <div class="grid-2" style="margin-top: 12px;">
    <div class="input-group">
      <label>Показник 1.8.1</label>
      <input type="number" step="0.001" id="curr_v181" placeholder="0.000">
    </div>
    <div class="input-group">
      <label>Показник 1.8.2</label>
      <input type="number" step="0.001" id="curr_v182" placeholder="0.000">
    </div>
  </div>
  <div class="input-group" style="margin-top: 12px;">
    <label>Ціна за кВт⋅год (грн)</label>
    <input type="number" step="0.01" id="price" value="4.32">
  </div>
</div>

<button class="btn" id="btnCalc">Розрахувати</button>

<!-- РЕЗУЛЬТАТ -->
<div class="card" id="resultBox">
  <div class="card-title">Результат розрахунку</div>
  <div id="resDetails"></div>
  <div class="res-total" id="resTotal">0.00 грн</div>
</div>

<!-- ПОПЕРЕДНІ ЗНАЧЕННЯ -->
<div class="card">
  <div class="card-title">Попередній місяць (База)</div>
  <div id="prevBadge" class="prev-badge">Немає збережених даних</div>
  <div id="prevEditActions" style="display:none; gap:8px;">
    <button class="btn-edit" id="btnEditPrev">✏️ Редагувати базу</button>
  </div>
  <button class="btn btn-danger" id="btnClearPrev">Скинути базу попереднього місяця</button>
</div>

<!-- ІСТОРІЯ -->
<div class="card">
  <div class="card-title">Історія записів</div>
  <div id="historyList"></div>
</div>

<div id="toast"></div>

<script>
let state = {
  prev: JSON.parse(localStorage.getItem('svitlo_prev')) || null,
  history: JSON.parse(localStorage.getItem('svitlo_history')) || []
};

document.addEventListener('DOMContentLoaded', () => {
  renderPrev();
  renderHistory();
  
  document.getElementById('btnCalc').addEventListener('click', calculate);
  document.getElementById('btnClearPrev').addEventListener('click', clearPrev);
  document.getElementById('btnEditPrev').addEventListener('click', editPrev);
  
  // Якщо додаток вже запущено як PWA, ховаємо верхню панель встановлення
  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
    document.getElementById('alwaysInstallCard').style.display = 'none';
  }
});

function renderPrev() {
  const b = document.getElementById('prevBadge');
  const actions = document.getElementById('prevEditActions');
  if(!state.prev) {
    b.innerHTML = 'Немає збережених даних. Перший розрахунок запише ці значення як стартові.';
    actions.style.display = 'none';
    return;
  }
  b.innerHTML = `
    <strong>Минулі показники:</strong><br>
    T1: ${parseFloat(state.prev.t1).toFixed(3)} | T2: ${parseFloat(state.prev.t2).toFixed(3)}<br>
    1.8.1: ${parseFloat(state.prev.v181).toFixed(3)} | 1.8.2: ${parseFloat(state.prev.v182).toFixed(3)}
  `;
  actions.style.display = 'block';
}

function editPrev() {
  if(!state.prev) return;
  
  const newT1 = prompt("Введіть нове значення для T1 (День):", state.prev.t1);
  if (newT1 === null) return; 
  const newT2 = prompt("Введіть нове значення для T2 (Ніч):", state.prev.t2);
  if (newT2 === null) return;
  const newV1 = prompt("Введіть нове значення для 1.8.1:", state.prev.v181);
  if (newV1 === null) return;
  const newV2 = prompt("Введіть нове значення для 1.8.2:", state.prev.v182);
  if (newV2 === null) return;

  state.prev = {
    t1: parseFloat(newT1) || 0,
    t2: parseFloat(newT2) || 0,
    v181: parseFloat(newV1) || 0,
    v182: parseFloat(newV2) || 0
  };
  
  localStorage.setItem('svitlo_prev', JSON.stringify(state.prev));
  renderPrev();
  showToast('✏️ Попередні дані успішно змінено!');
}

function calculate() {
  const c_t1 = parseFloat(document.getElementById('curr_t1').value) || 0;
  const c_t2 = parseFloat(document.getElementById('curr_t2').value) || 0;
  const c_v181 = parseFloat(document.getElementById('curr_v181').value) || 0;
  const c_v182 = parseFloat(document.getElementById('curr_v182').value) || 0;
  const p = parseFloat(document.getElementById('price').value) || 0;

  if(!c_t1 || !c_t2 || !c_v181 || !c_v182) {
    showToast('❌ Заповніть всі показники!');
    return;
  }

  if(!state.prev) {
    state.prev = { t1: c_t1, t2: c_t2, v181: c_v181, v182: c_v182 };
    localStorage.setItem('svitlo_prev', JSON.stringify(state.prev));
    renderPrev();
    showToast('💾 Стартові дані збережено! Наступний розрахунок покаже результат.');
    return;
  }

  const t1rez = c_t1 - state.prev.t1;
  const t2rez = c_t2 - state.prev.t2;

  if (t1rez < 0 || t2rez < 0) {
    showToast('⚠️ Поточні показники менші за попередні!');
    return;
  }

  const t1sum = t1rez * p;
  const t2sum = (t2rez * p) / 2;
  const tsum = t1sum + t2sum;

  const html = `
    <div class="res-row"><span>T1 (Цей місяць):</span><strong>${c_t1.toFixed(3)}</strong></div>
    <div class="res-row"><span>T2 (Цей місяць):</span><strong>${c_t2.toFixed(3)}</strong></div>
    <div class="res-row"><span>T1rez (Різниця T1):</span><strong>${t1rez.toFixed(3)} кВт</strong></div>
    <div class="res-row"><span>T2rez (Різниця T2):</span><strong>${t2rez.toFixed(3)} кВт</strong></div>
    <div class="res-row"><span>T1sum (Сума День):</span><strong>${t1sum.toFixed(2)} грн</strong></div>
    <div class="res-row"><span>T2sum (Сума Ніч):</span><strong>${t2sum.toFixed(2)} грн</strong></div>
  `;
  
  document.getElementById('resDetails').innerHTML = html;
  document.getElementById('resTotal').textContent = `${tsum.toFixed(2)} грн`;
  document.getElementById('resultBox').style.display = 'block';

  const record = {
    id: Date.now(),
    date: new Date().toLocaleString('uk-UA'),
    c_t1, c_t2,
    t1rez, t2rez,
    t1sum, t2sum,
    tsum
  };

  state.history.unshift(record);
  localStorage.setItem('svitlo_history', JSON.stringify(state.history));
  
  state.prev = { t1: c_t1, t2: c_t2, v181: c_v181, v182: c_v182 };
  localStorage.setItem('svitlo_prev', JSON.stringify(state.prev));
  
  renderPrev();
  renderHistory();
  showToast('✅ Розраховано та збережено!');
}

function renderHistory() {
  const container = document.getElementById('historyList');
  if(state.history.length === 0) {
    container.innerHTML = '<div style="color:var(--muted); font-size:12px; text-align:center; padding:10px;">Історія порожня</div>';
    return;
  }

  container.innerHTML = state.history.map(item => `
    <div class="history-item">
      <div class="history-date">${item.date}</div>
      <button class="history-del" onclick="deleteHistory(${item.id})">×</button>
      <div><strong>Разом до сплати: <span style="color:var(--accent3)">${item.tsum.toFixed(2)} грн</span></strong></div>
      <div class="history-grid">
        <div>T1 цей міс: ${item.c_t1.toFixed(3)}</div>
        <div>T2 цей міс: ${item.c_t2.toFixed(3)}</div>
        <div>T1rez: ${item.t1rez.toFixed(3)}</div>
        <div>T2rez: ${item.t2rez.toFixed(3)}</div>
        <div>T1sum: ${item.t1sum.toFixed(2)} грн</div>
        <div>T2sum: ${item.t2sum.toFixed(2)} грн</div>
      </div>
    </div>
  `).join('');
}

window.deleteHistory = function(id) {
  state.history = state.history.filter(x => x.id !== id);
  localStorage.setItem('svitlo_history', JSON.stringify(state.history));
  renderHistory();
  showToast('🗑️ Запис видалено');
};

function clearPrev() {
  if(confirm('Ви дійсно хочете скинути базу попереднього місяця?')) {
    state.prev = null;
    localStorage.removeItem('svitlo_prev');
    renderPrev();
    showToast('🗑️ Базу скинуто');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ПЕРЕХВАТ ІГНОРУВАННЯ ТА ОБРОБКА КНОПКИ
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
});

document.getElementById('btnAlwaysInstall').addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    if (outcome === 'accepted') {
      showToast('✅ Додаток встановлено!');
      document.getElementById('alwaysInstallCard').style.display = 'none';
    }
  } else {
    // Якщо браузер не створив подію автоматично, даємо інструкцію
    alert("Натисни на кнопку 'три крапки' вгорі Chrome або 'Поділитись' в Safari та вибери 'Додати на головний екран'.");
  }
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const newWorker = reg.installing;
      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          showToast('🔄 Оновлення калькулятора...');
          setTimeout(() => { window.location.reload(); }, 1500);
        }
      });
    });
  }).catch(() => {});
}
</script>
</body>
</html>
